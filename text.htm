<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc Nghiệm Tương Tác</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 25px;
            font-size: 24px;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: 600;
            color: #6b7280;
            font-size: 14px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .question-box {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
        }

        .option-item {
            background: #f9fafb;
            border: 2px solid var(--border-color);
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 16px;
        }

        .option-item:hover:not(.disabled) {
            background: #eef2ff;
            border-color: var(--primary);
        }

        .option-item.correct {
            background-color: #d1fae5;
            border-color: var(--success);
            color: #065f46;
            font-weight: 600;
        }

        .option-item.incorrect {
            background-color: #fee2e2;
            border-color: var(--error);
            color: #991b1b;
            font-weight: 600;
        }

        .option-item.disabled {
            cursor: default;
        }

        .footer-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .score-card {
            text-align: center;
            display: none;
        }

        .score-card h2 {
            color: var(--primary);
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Ứng Dụng Trắc Nghiệm Thông Minh</h1>
    
    <div id="quiz-container">
        <div class="quiz-header">
            <span id="question-progress">Câu hỏi 1/5</span>
            <span id="score-display">Điểm: 0</span>
        </div>
        
        <div class="question-box" id="question-text">
            Đang tải câu hỏi...
        </div>
        
        <ul class="options-list" id="options-list">
            <!-- Các lựa chọn A, B, C, D sẽ được render bằng JavaScript -->
        </ul>
        
        <div class="footer-nav">
            <span id="feedback-msg" style="font-weight: 600;"></span>
            <button class="btn" id="next-btn" onclick="nextQuestion()" style="display: none;">Câu tiếp theo</button>
        </div>
    </div>

    <div class="score-card" id="score-card">
        <h2>Kết Quả Bài Kiểm Tra</h2>
        <p id="final-score" style="font-size: 20px; font-weight: bold; margin-bottom: 20px;"></p>
        <button class="btn" onclick="restartQuiz()">Làm lại bài</button>
    </div>
</div>

<script>
    // Dữ liệu câu hỏi mẫu (bạn có thể thêm câu hỏi thoải mái)
    const rawQuestions = [
        {
            question: "Thủ đô của nước Việt Nam là gì?",
            correct: "Hà Nội",
            incorrect: ["Hồ Chí Minh", "Đà Nẵng", "Hải Phòng"]
        },
        {
            question: "Ngôn ngữ lập trình nào phổ biến nhất cho Trí tuệ nhân tạo (AI)?",
            correct: "Python",
            incorrect: ["Java", "C++", "PHP"]
        },
        {
            question: "Đâu là hành tinh lớn nhất trong Hệ Mặt Trời?",
            correct: "Sao Mộc",
            incorrect: ["Sao Thổ", "Trái Đất", "Sao Hỏa"]
        },
        {
            question: "Sông nào dài nhất thế giới?",
            correct: "Sông Nile",
            incorrect: ["Sông Amazon", "Sông Mekong", "Sông Trường Giang"]
        },
        {
            question: "Năm nào Chiến tranh thế giới thứ hai kết thúc?",
            correct: "1945",
            incorrect: ["1939", "1954", "1975"]
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;

    // Hàm trộn ngẫu nhiên mảng (Fisher-Yates shuffle)
    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Trộn thứ tự câu hỏi khi bắt đầu
    let questions = shuffleArray(rawQuestions);

    function loadQuestion() {
        answered = false;
        document.getElementById('feedback-msg').textContent = '';
        document.getElementById('next-btn').style.display = 'none';

        const currentQ = questions[currentQuestionIndex];
        document.getElementById('question-progress').textContent = `Câu hỏi ${currentQuestionIndex + 1}/${questions.length}`;
        document.getElementById('score-display').textContent = `Điểm: ${score}`;
        document.getElementById('question-text').textContent = currentQ.question;

        // Gộp đáp án đúng và sai, sau đó trộn ngẫu nhiên vị trí (A, B, C, D)
        const allOptions = shuffleArray([currentQ.correct, ...currentQ.incorrect]);
        const optionsList = document.getElementById('options-list');
        optionsList.innerHTML = '';

        const labels = ['A', 'B', 'C', 'D'];
        allOptions.forEach((optionText, index) => {
            const li = document.createElement('li');
            li.className = 'option-item';
            li.innerHTML = `<strong>${labels[index]}.</strong> ${optionText}`;
            li.onclick = () => selectOption(li, optionText, currentQ.correct);
            optionsList.appendChild(li);
        });
    }

    function selectOption(selectedElement, selectedText, correctText) {
        if (answered) return;
        answered = true;

        const options = document.querySelectorAll('.option-item');
        options.forEach(opt => {
            opt.classList.add('disabled');
            // Kiểm tra nội dung text bên trong thẻ để đánh dấu đáp án đúng
            const textContent = opt.textContent.substring(3).trim();
            if (textContent === correctText) {
                opt.classList.add('correct');
            }
        });

        const feedbackMsg = document.getElementById('feedback-msg');
        if (selectedText === correctText) {
            selectedElement.classList.add('correct');
            feedbackMsg.textContent = "Chính xác! 🎉";
            feedbackMsg.style.color = "var(--success)";
            score += 10;
            document.getElementById('score-display').textContent = `Điểm: ${score}`;
        } else {
            selectedElement.classList.add('incorrect');
            feedbackMsg.textContent = "Chưa chính xác! ❌";
            feedbackMsg.style.color = "var(--error)";
        }

        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            document.getElementById('quiz-container').style.display = 'none';
            const scoreCard = document.getElementById('score-card');
            scoreCard.style.display = 'block';
            document.getElementById('final-score').textContent = `Bạn đã đạt được ${score} / ${questions.length * 10} điểm!`;
        }
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        questions = shuffleArray(rawQuestions);
        document.getElementById('score-card').style.display = 'none';
        document.getElementById('quiz-container').style.display = 'block';
        loadQuestion();
    }

    // Khởi chạy câu hỏi đầu tiên
    window.onload = loadQuestion;
</script>

</body>
</html>
